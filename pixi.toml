[workspace]
authors = ["Ryan Shìjié Dù <ryan.du@mines.edu>"]
channels = ["conda-forge"]
name = "GPGN268-BOOK"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "jupyter-book build . --path-output _build"

[dependencies]
python = ">=3.14.3,<3.15"
jupyter-book = ">=2.1.2,<3"
numpy = ">=2.4.3,<3"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
xarray = ">=2026.2.0,<2027"
cartopy = ">=0.25.0,<0.26"
netcdf4 = ">=1.7.4,<2"
scipy = ">=1.17.1,<2"
hvplot = ">=0.12.2,<0.13"
